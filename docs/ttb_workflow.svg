<svg width="1400" height="500" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="30"
        font-family="Calibri, Arial"
        font-size="24"
        font-weight="bold"
        text-anchor="middle">
    TTB Label Review Proof of Concept
  </text>

  <text x="700" y="55"
        font-family="Calibri, Arial"
        font-size="14"
        text-anchor="middle"
        fill="#666">
    OCR-Based Label Validation Workflow
  </text>

  <!-- Label Image -->
  <rect x="30" y="180" width="140" height="70"
        rx="10" ry="10"
        fill="#D9D9D9" stroke="#555" stroke-width="2"/>
  <text x="100" y="210"
        font-family="Calibri, Arial"
        font-size="15"
        text-anchor="middle"
        font-weight="bold">
    Label Image
  </text>
  <text x="100" y="230"
        font-family="Calibri, Arial"
        font-size="12"
        text-anchor="middle">
    Input
  </text>

  <!-- Image Upload -->
  <rect x="240" y="180" width="160" height="70"
        rx="12" ry="12"
        fill="#4472C4" stroke="#2F5597" stroke-width="2"/>
  <text x="320" y="222"
        font-family="Calibri, Arial"
        font-size="15"
        fill="white"
        text-anchor="middle"
        font-weight="bold">
    Image Upload
  </text>

  <!-- OCR -->
  <rect x="470" y="180" width="180" height="70"
        rx="12" ry="12"
        fill="#4472C4" stroke="#2F5597" stroke-width="2"/>
  <text x="560" y="212"
        font-family="Calibri, Arial"
        font-size="15"
        fill="white"
        text-anchor="middle"
        font-weight="bold">
    OCR Processing
  </text>
  <text x="560" y="232"
        font-family="Calibri, Arial"
        font-size="12"
        fill="white"
        text-anchor="middle">
    Tesseract
  </text>

  <!-- Raw OCR -->
  <rect x="720" y="180" width="180" height="70"
        fill="#DDEBF7"
        stroke="#5B9BD5"
        stroke-width="2"/>
  <text x="810" y="222"
        font-family="Calibri, Arial"
        font-size="15"
        text-anchor="middle"
        font-weight="bold">
    Raw OCR Text
  </text>

  <!-- Field Extraction -->
  <rect x="970" y="140" width="220" height="150"
        rx="12" ry="12"
        fill="#4472C4"
        stroke="#2F5597"
        stroke-width="2"/>

  <text x="1080" y="170"
        font-family="Calibri, Arial"
        font-size="16"
        fill="white"
        text-anchor="middle"
        font-weight="bold">
    Field Extraction
  </text>

  <text x="1080" y="200"
        font-family="Calibri, Arial"
        font-size="12"
        fill="white"
        text-anchor="middle">
    Alcohol Content
  </text>

  <text x="1080" y="220"
        font-family="Calibri, Arial"
        font-size="12"
        fill="white"
        text-anchor="middle">
    Net Contents
  </text>

  <text x="1080" y="240"
        font-family="Calibri, Arial"
        font-size="12"
        fill="white"
        text-anchor="middle">
    Vintage
  </text>

  <text x="1080" y="260"
        font-family="Calibri, Arial"
        font-size="12"
        fill="white"
        text-anchor="middle">
    Government Warning
  </text>

  <!-- Structured Data -->
  <rect x="970" y="350" width="220" height="70"
        fill="#DDEBF7"
        stroke="#5B9BD5"
        stroke-width="2"/>

  <text x="1080" y="392"
        font-family="Calibri, Arial"
        font-size="15"
        text-anchor="middle"
        font-weight="bold">
    Structured Label Data
  </text>

  <!-- Application Data -->
  <rect x="970" y="20" width="220" height="90"
        rx="10" ry="10"
        fill="#D9D9D9"
        stroke="#555"
        stroke-width="2"/>

  <text x="1080" y="48"
        font-family="Calibri, Arial"
        font-size="15"
        text-anchor="middle"
        font-weight="bold">
    Application Data
  </text>

  <text x="1080" y="68"
        font-family="Calibri, Arial"
        font-size="11"
        text-anchor="middle">
    Alcohol Content
  </text>

  <text x="1080" y="84"
        font-family="Calibri, Arial"
        font-size="11"
        text-anchor="middle">
    Net Contents • Vintage
  </text>

  <!-- Comparison Engine -->
  <rect x="1240" y="180" width="140" height="70"
        rx="12" ry="12"
        fill="#4472C4"
        stroke="#2F5597"
        stroke-width="2"/>

  <text x="1310" y="222"
        font-family="Calibri, Arial"
        font-size="15"
        fill="white"
        text-anchor="middle"
        font-weight="bold">
    Compare
  </text>

  <!-- Validation -->
  <rect x="1240" y="300" width="140" height="90"
        rx="12" ry="12"
        fill="#ED7D31"
        stroke="#C55A11"
        stroke-width="2"/>

  <text x="1310" y="324"
        font-family="Calibri, Arial"
        font-size="14"
        fill="white"
        text-anchor="middle"
        font-weight="bold">
    Validation
  </text>

  <text x="1310" y="345"
        font-family="Calibri, Arial"
        font-size="11"
        fill="white"
        text-anchor="middle">
    MATCH
  </text>

  <text x="1310" y="362"
        font-family="Calibri, Arial"
        font-size="11"
        fill="white"
        text-anchor="middle">
    MISMATCH
  </text>

  <text x="1310" y="379"
        font-family="Calibri, Arial"
        font-size="11"
        fill="white"
        text-anchor="middle">
    MISSING
  </text>

  <!-- Summary -->
  <rect x="1240" y="430" width="140" height="60"
        rx="12" ry="12"
        fill="#70AD47"
        stroke="#548235"
        stroke-width="2"/>

  <text x="1310" y="466"
        font-family="Calibri, Arial"
        font-size="15"
        fill="white"
        text-anchor="middle"
        font-weight="bold">
    Summary
  </text>

  <!-- Connectors -->
  <line x1="170" y1="215" x2="240" y2="215" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="215" x2="470" y2="215" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="215" x2="720" y2="215" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="215" x2="970" y2="215" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1080" y1="290" x2="1080" y2="350" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1190" y1="385" x2="1240" y2="215" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1080" y1="110" x2="1080" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1380" y1="250" x2="1380" y2="300" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1310" y1="390" x2="1310" y2="430" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

</svg>